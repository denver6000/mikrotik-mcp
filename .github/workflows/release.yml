name: Release

# Publishes to npm when a version tag is pushed.
#
# Authentication is npm trusted publishing (OIDC): no NPM_TOKEN secret, no
# long-lived credential to leak, and provenance is attached automatically.
# It requires a one-time setup on npmjs.com — see the Release section of the
# README — and that setup can only be done once the package exists, so the
# first publish is done locally.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1. The
          # published package still supports Node 18; this is only the
          # toolchain that builds and publishes it.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      # The tag is the release's claim about what is being published; if it
      # disagrees with package.json, stop rather than publish the wrong version.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi
          echo "Publishing version $pkg"

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Fails loudly rather than silently publishing a half-built package.
      - name: Check the build output is present
        run: test -f dist/index.js && test -d docs

      # Auth works two ways, so the same workflow covers both phases:
      #   - First release: NPM_TOKEN is set as a repository secret. Trusted
      #     publishing cannot be used yet, because it is configured on an
      #     existing package's settings page and the package does not exist.
      #   - Afterwards: delete the secret and configure the trusted publisher.
      #     NODE_AUTH_TOKEN is then empty and npm authenticates over OIDC.
      # --provenance is explicit so the token path gets provenance too; it is
      # automatic on the OIDC path and harmless to pass.
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
